[project]
name = "wai-telegram"
version = "0.1.0"
description = "Closed single-owner Telegram archive, media pipeline, agents, and MCP"
readme = "PRODUCTION_CUTOVER.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/backend", "packages/mcp-server"]

[tool.uv]
constraint-dependencies = [
    "click>=8.3.3",
    "idna>=3.15",
    "mako>=1.3.12",
    "pyasn1>=0.6.4",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
